name: Source and landscape verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install pillow==12.3.0
      - name: Restore assets and verify production build
        run: npm run verify:build
      - name: Verify terrain, cliff and forest integration
        run: npm run check:landscape
      - name: Compare compiled worker with production geometry
        run: node scripts/control/check-worker.mjs

      # This job establishes source/CPU/build correctness. Browser art, film,
      # runtime and the original completion ledger remain separate open gates.
