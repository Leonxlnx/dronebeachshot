<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#182628"/><meta name="description" content="A continuous flight from a forested summit into Last Light Bay and out toward the setting sun."/><title>Last Light Bay</title></head><body><main id="app"><canvas id="world" aria-label="Last Light Bay interactive three-dimensional coastal environment"></canvas><div id="loading" role="status"><span>Last Light Bay</span><p id="load-label">Preparing the coast</p><progress id="load-progress" max="100" value="0"></progress></div><div id="intro" hidden><h1>Last Light Bay</h1><button id="start">Begin flight <span>↗</span></button></div><nav id="controls" aria-label="Flight controls" hidden><button id="play" aria-label="Pause flight">Pause</button><button id="replay">Replay</button><button id="sound" aria-pressed="false">Sound off</button><button id="fullscreen">Fullscreen</button><label class="quality-label">Quality <select id="quality"><option value="high">Cinematic</option><option value="balanced" selected>Balanced</option><option value="low">Light</option></select></label><label id="time-label"><span id="clock">0:00</span><input type="range" id="timeline" min="0" max="20" step="0.01" value="0" aria-label="Flight timeline"/></label></nav><button id="show-controls" aria-label="Show flight controls" hidden>•••</button><div id="error" role="alert" hidden></div><div id="diagnostics" hidden></div></main><script type="module" src="/src/main.ts"></script></body></html>
