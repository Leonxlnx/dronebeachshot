function syntheticTexture(name,index){

const textureSets={},materials=new Map();
async function textures(kind){

 for(const [name,file]of Object.entries(textureFiles)){
  result[name]=kind==='synthetic'?syntheticTexture(name,index):configureTexture(await new THREE.TextureLoader().loadAsync('/source256/'+file+'.png'),name);index++;
 }
 result.bark=result.soil;result.barkNormal=result.soilNormal;return textureSets[kind]=result;
}
const maskCode=`
 // Deliberately force different exact layer masks inside 2x2 derivative quads.
 // These are diagnostic masks, not a modified production terrain field.
 float fixtureCell=mod(floor(gl_FragCoord.x+uFixtureMaskOffset)+3.*floor(gl_FragCoord.y),8.);
 if(uFixtureMaskPattern<.5){cliff=0.;moss=0.;sediment=1.;}
 else if(fixtureCell<1.){cliff=0.;moss=0.;sediment=1.;}
 else if(fixtureCell<2.){cliff=0.;moss=0.;sediment=0.;}
 else if(fixtureCell<3.){cliff=1.;moss=0.;sediment=0.;}
 else if(fixtureCell<4.){cliff=.43;moss=.62;sediment=.2;}
 else if(fixtureCell<5.){cliff=0.;moss=.4;sediment=.2;}
 else if(fixtureCell<6.){cliff=.34;moss=0.;sediment=.21;}
 else if(fixtureCell<7.){cliff=1.401298464e-45;moss=1.401298464e-45;sediment=1.401298464e-45;}

async function materialFor(textureKind,variant,kind){

 const material=kind==='continuation'?(variant==='original'?originalContinuation:candidateContinuation)(t):kind==='rock'?lib.createRockMaterial(t):lib.createGroundMaterial(t,true);
 const previous=material.onBeforeCompile.bind(material),keyBefore=material.customProgramCacheKey();
 material.onBeforeCompile=(shader,renderer)=>{
  previous(shader,renderer);Object.assign(shader.uniforms,fixture);
  shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nuniform vec3 uFixtureOrigin,uFixtureNormal;uniform vec2 uFixtureSpan;');
  shader.vertexShader=shader.vertexShader.replace('vGroundWorld=(groundTransform*vec4(position,1.)).xyz;','vGroundWorld=uFixtureOrigin+vec3(position.x*uFixtureSpan.x,0.,position.z*uFixtureSpan.y);');

   shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nuniform float uFixtureMaskPattern,uFixtureMaskOffset;');
   const maskAnchor='float moss=patches*moisture*(.55+.45*habitat.a)*soilSupport*(1.-sediment);';

function base64(bytes){let str='';for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(str);}
function preview(pixels){
 const output=document.createElement('canvas');output.width=output.height=size;const context=output.getContext('2d'),image=context.createImageData(size,size);

 for(let y=0;y<size;y++)for(let x=0;x<size;x++)for(let c=0;c<4;c++)image.data[(y*size+x)*4+c]=c===3?255:Math.round(srgb(pixels[((size-1-y)*size+x)*4+c])*255);

window.groundProbe={
 metadata(){const ext=gl.getExtension('WEBGL_debug_renderer_info');return{size,threeRevision:THREE.REVISION,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),maxAnisotropy:renderer.capabilities.getMaxAnisotropy(),floatTarget:true,preview:'sRGB conversion of actual finite linear Float32 target; no tone mapping',sourceTextures:'separate synthetic and source-derived256 test sets'};},
 async render({textureKind,variant,kind,mode,origin,span,normal,maskPattern,maskOffset,bedding,mineral}){

  fixture.uFixtureMaskPattern.value=maskPattern;fixture.uFixtureMaskOffset.value=maskOffset;
  worldTime.value=6.125;original.stoneBeddingAligned.value=candidate.stoneBeddingAligned.value=bedding;
  original.mineralReliefStrength.value=candidate.mineralReliefStrength.value=mineral;
  original.sandRippleStrength.value=candidate.sandRippleStrength.value=.2;

};
